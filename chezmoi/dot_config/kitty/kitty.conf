# Typography
font_family Monaspace Krypton
font_size 11
disable_ligatures never

# Colors
foreground #d8dee9
background #191919
# Light theme for screenshots in academic papers
# foreground #191919
# background #ffffff
url_color #0087bd
url_style curly

# Cursor
cursor #d0d0d0
cursor_shape underline
cursor_blink_interval 0.5
cursor_stop_blinking_after 15
# Keep the configured underline cursor (above) instead of letting shell
# integration use a different cursor (ZSH auto-requests beam cursor from the
# integration)
shell_integration no-cursor

# Background
background_opacity 0.9
dynamic_background_opacity yes
background_blur 2

# Scrolling and selection
scrollback_lines 50000
select_by_word_characters :@-./_~?&=%+#

# Clipboard and paste safety
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
paste_actions quote-urls-at-prompt,confirm

# Window behavior
# Hyprland currently reports tiled Kitty windows as maximized on close
remember_window_size no
# Never prompt before closing a Kitty window or tab
confirm_os_window_close 0

# Alerts and updates
enable_audio_bell no
visual_bell_duration 0
update_check_interval 0

# Keep terminal-output and remote sessions from controlling Kitty
allow_remote_control no
