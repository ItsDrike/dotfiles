################################################################################
# Desktop theming
################################################################################

# Ask GTK applications to use the XDG desktop portal for standard dialogs.
GTK_USE_PORTAL=1

# qt6ct accepts the qt5ct platform-theme key as a compatibility alias.
# Qt 5 and Qt 6 applications then load their respective qtct plugins and
# configs.
QT_QPA_PLATFORMTHEME=qt5ct
QT_STYLE_OVERRIDE=kvantum
QT_QPA_PLATFORM=wayland;xcb

# XCursor remains necessary for applications without Hyprcursor support.
XCURSOR_THEME=XCursor-Pro-Light
XCURSOR_SIZE=24

# Hyprland uses the scalable cursor representation when available.
HYPRCURSOR_THEME=XCursor-Pro-Hyprcursor-Light
HYPRCURSOR_SIZE=24
