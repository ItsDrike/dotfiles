# The target is a mutable symlink in the media library, deliberately kept
# outside dotfiles so wallpapers do not become tracked configuration.
$wallpaper = ~/Media/Pictures/Wallpapers/active-bg

# Use the same wallpaper for every output, including dynamically attached ones.
wallpaper {
    monitor =
    path = $wallpaper
    fit_mode = cover
}

# Enable the IPC socket (allows dynamically setting a new wallpaper on runtime,
# choosing the fit mode, consuming monitor-added and monitor-removed events
# from scripts, or querying the currently active wallpaper)
ipc = true

# Don't show Hyprpaper splash text over the wallpaper
splash = false
splash_offset = 20
splash_opacity = 0.8
