[Service]
# Softly protect up to 100MiB of Hyprland's memory during memory pressure.
#
# This biases memory reclaims towards less-protected cgroups first, reducing
# the chance that Hyprland is disrupted or ultimately selected for an OOM kill.
#
# In general, reclaim prefers to:
# - Reclaim memory from processes in less-protected cgroups first (without
#   any MemoryLow value set)
# - If that isn't possible / enough, also reclaim from cgroups with MemoryLow,
#   but only reclaim the memory above the specified MemoryLow value.
# - If that still isn't possible / enough to avoid OOM kills, allow reclaiming
#   even on the protected MemoryLow.
# - If that still isn't enough, OOM kill something.
MemoryLow=100M
