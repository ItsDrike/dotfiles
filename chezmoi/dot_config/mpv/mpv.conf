# Playback
loop-file=inf
keep-open=yes
keep-open-pause=yes
force-window=yes

# Save playback position only when explicitly quitting with Shift+Q
save-position-on-quit=no
resume-playback=yes

# Configure hardware-accelerated decoding with automatic software fallback.
#
# On Linux, VA-API works on Intel and AMD GPUs (iGPU or dGPU). If it is
# unavailable, `auto` falls back to MPV's normal hardware-decoder selection
# (including NVDEC where usable), then to software decoding.
#
# Trying VA-API first avoids waking a potentially suspended NVIDIA dGPU on
# laptops merely to discover that the iGPU can decode. This wakeup is both
# battery inefficient and causes  asynchronous wait, which can make mpv startup
# feel slow (often over 2 seconds).
#
# On a hybrid system, NVIDIA decoding can be requested with:
# - `prime-run mpv --hwdec=nvdec [path]` (NVIDIA rendering and decoding), or
# - `mpv --hwdec=nvdec-copy [path]` (NVIDIA decoding, iGPU rendering).
hwdec=vaapi,auto

# Prefer OpenGL for normal playback. Vulkan (default) performs device
# discovery, which can query every installed Vulkan driver; on hybrid NVIDIA
# systems this can wake a suspended dGPU and delay startup. EGL/OpenGL normally
# creates its context directly on the GPU driving the Wayland session instead.
#
# On a hybrid system, Vulkan can be explicitly requested with:
# - `prime-run mpv --gpu-api=vulkan --hwdec=vaapi-copy [path]` (NVIDIA
#   rendering, Intel/AMD VA-API decoding), or
# - `prime-run mpv --gpu-api=vulkan --hwdec=nvdec [path]` (NVIDIA rendering
#   and decoding).
#
# Note that Vulkan is not actually needed for ordinary playback even if we're
# using an NVIDIA dGPU. OpenGL also works normally with NVIDIA PRIME offload.
# Vulkan is mainly better for some advanced features (HDR, high-resolution /
# high-refresh rate playback, heavy shaders, ...). It may be the better choice
# when already using NVIDIA, but it is not necessary for ordinary playback.
gpu-api=opengl
